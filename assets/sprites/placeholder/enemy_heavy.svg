<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy enemy - Iron Guard -->
  <rect x="20" y="8" width="24" height="48" fill="#708090" stroke="#2F4F4F" stroke-width="2" rx="4"/>
  <!-- Helmet -->
  <rect x="22" y="10" width="20" height="12" fill="#5A5A5A" stroke="#2F4F4F" stroke-width="2" rx="2"/>
  <!-- Eye slit -->
  <rect x="24" y="16" width="16" height="3" fill="#FF4444"/>
  <!-- Shield -->
  <rect x="12" y="20" width="10" height="16" fill="#4A4A4A" stroke="#2F4F4F" stroke-width="2" rx="2"/>
  <!-- Weapon -->
  <line x1="42" y1="28" x2="52" y2="32" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="56" y2="38" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>
</svg>