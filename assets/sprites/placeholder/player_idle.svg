<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple stick figure player -->
  <!-- Head -->
  <circle cx="32" cy="16" r="8" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  <!-- Body -->
  <line x1="32" y1="24" x2="32" y2="44" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="32" y1="30" x2="22" y2="36" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="42" y2="36" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="32" y1="44" x2="24" y2="58" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="40" y2="58" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword indicator -->
  <line x1="42" y1="36" x2="50" y2="42" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
</svg>